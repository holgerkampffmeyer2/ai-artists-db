name: Add AI Artist Entry
description: Add a new artist/project to the Known AI Artists Database
labels: ["triage"]
body:
  - type: input
    id: id
    attributes:
      label: ID
      description: Unique kebab-case identifier (lowercase letters, numbers, hyphens only)
      placeholder: "my-artist"
    validations:
      required: true

  - type: input
    id: name
    attributes:
      label: Name
      description: Primary artist/project name
    validations:
      required: true

  - type: input
    id: aliases
    attributes:
      label: Aliases
      description: Comma-separated alternative names, handles, spellings (optional)
    validations:
      required: false

  - type: dropdown
    id: type
    attributes:
      label: Type
      description: What type of entry is this?
      options:
        - artist
        - project
        - collective
    validations:
      required: true

  - type: input
    id: labels
    attributes:
      label: Labels
      description: Comma-separated record labels (optional)
    validations:
      required: false

  - type: dropdown
    id: ai_confidence
    attributes:
      label: AI Confidence
      description: How confident are you that this artist produces AI-generated music?
      options:
        - high
        - medium
        - low
    validations:
      required: true

  - type: input
    id: evidence_url
    attributes:
      label: Evidence URL
      description: URL to evidence source (article, investigation, etc.)
      placeholder: "https://example.com/article"
    validations:
      required: true

  - type: textarea
    id: evidence_note
    attributes:
      label: Evidence Note
      description: What does this evidence show? Why is it relevant?
      placeholder: "Article about AI generation patterns"
    validations:
      required: true

  - type: input
    id: evidence_date
    attributes:
      label: Evidence Date
      description: When was the evidence published? (YYYY-MM format)
      placeholder: "2026-01"
    validations:
      required: true
